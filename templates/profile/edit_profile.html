<!DOCTYPE html>
<html>
<head>
<title>Edit Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
}

.edit-card {
    max-width: 750px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h3 {
    font-weight: bold;
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    margin-bottom: 5px;
    display: block;
}

input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin-top: 5px;
}

textarea {
    resize: none;
    height: 100px;
}

button {
    background: #16a34a;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #15803d;
}

.btn-secondary {
    background: #6b7280;
    text-align: center;
    display: block;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    color: white;
    text-decoration: none;
}

.btn-secondary:hover {
    background: #4b5563;
}
</style>

</head>

<body>

<div class="edit-card">

<h3 class="mb-4">Edit Profile</h3>

{% for message in messages %}
<div class="alert alert-info">{{ message }}</div>
{% endfor %}

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>Username</label>
{{ u_form.username }}
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
{{ u_form.email }}
</div>

<div class="col-md-12 mb-3">
<label>Profile Picture</label>
{{ p_form.image }}
</div>

<div class="col-md-12 mb-3">
<label>Bio</label>
{{ p_form.bio }}
</div>

<div class="col-md-12 mb-3">
<label>Preferences</label>
{{ p_form.preferences }}
</div>

</div>

<button class="btn btn-success w-100">Save Changes</button>

<a href="{% url 'dashboard' %}" class="btn btn-secondary w-100 mt-2">
Cancel
</a>

</form>

</div>

</body>
</html>
